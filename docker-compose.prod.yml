services:
  site:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tracepublique.fr}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-https://github.com/ggarret/tracepublique}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-tracepublique.fr}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

name: Public CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Validate data and contracts
        run: |
          yarn validate:data
          yarn validate:evaluation-contract
          yarn validate:snapshot

      - name: Test
        run: yarn test:proposal-feed

      - name: Build
        run: yarn build

  dispatch-ops:
    name: Trigger private deployment
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release SHA to tracepublic-ops
        env:
          OPS_DISPATCH_TOKEN: ${{ secrets.TRACEPUBLIC_OPS_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${OPS_DISPATCH_TOKEN}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/ggarret/tracepublic-ops/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${OPS_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "{\"event_type\":\"public-main-ready\",\"client_payload\":{\"sha\":\"${RELEASE_SHA}\"}}"

name: Signaler un problème technique
description: Décrire un comportement incorrect du site, des scripts ou de l'API.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes de reproduction
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: Navigateur, appareil, version ou commande utilisée
  - type: checkboxes
    id: security
    attributes:
      label: Sécurité
      options:
        - label: Ce signalement ne contient pas de vulnérabilité exploitable ni de secret.
          required: true

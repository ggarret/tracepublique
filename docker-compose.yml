services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: observatoire
      POSTGRES_USER: observatoire
      POSTGRES_PASSWORD: observatoire_dev
    ports:
      - "5432:5432"
    volumes:
      - observatoire_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["api"]
    environment:
      DATABASE_URL: postgresql://observatoire:observatoire_dev@postgres:5432/observatoire?schema=public
      API_PORT: 3001
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/main.js"]

volumes:
  observatoire_postgres_data:
